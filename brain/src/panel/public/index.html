<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI 玩家</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>AI 玩家 · 面板</h1>
      <input type="text" name="username" autocomplete="username" value="owner" hidden>
      <label for="login-password">访问口令</label>
      <input id="login-password" type="password" autocomplete="current-password" required autofocus>
      <p class="hint">口令在大脑首次启动时打印过，也保存在数据目录的 config.json（panel.password）里。</p>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">登录</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside id="side" class="side" aria-label="AI 玩家的状态和导航">
      <div id="side-status" class="side-status" aria-live="polite"></div>
      <nav id="nav" class="nav" aria-label="页面">
        <button type="button" data-page="now"><span class="nav-mark" aria-hidden="true"></span>现在</button>
        <button type="button" data-page="chat"><span class="nav-mark" aria-hidden="true"></span>对话</button>
        <button type="button" data-page="knowledge"><span class="nav-mark" aria-hidden="true"></span>知识<span id="nav-feedback-count" class="count" title="意见簿里还没看过的条数" hidden></span></button>
        <button type="button" data-page="build"><span class="nav-mark" aria-hidden="true"></span>建造</button>
        <button type="button" data-page="settings"><span class="nav-mark" aria-hidden="true"></span>设置</button>
      </nav>
      <div class="side-bottom">
        <div id="side-foot"></div>
        <button id="logout" type="button" class="quiet small">退出登录</button>
      </div>
    </aside>

    <main id="main" class="main">
      <section id="page-now" class="page page-now" aria-label="现在" hidden></section>
      <section id="page-chat" class="page page-chat" aria-label="对话" hidden></section>
      <section id="page-knowledge" class="page" aria-label="知识" hidden></section>
      <section id="page-build" class="page" aria-label="建造" hidden></section>
      <section id="page-settings" class="page" aria-label="设置" hidden></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
